<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111827" />
      <stop offset="100%" style="stop-color:#1F2937" />
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Floor -->
  <path d="M50,300 L750,300 L750,350 L50,350 Z" fill="#1F2937" opacity="0.7" />
  
  <!-- Walls -->
  <path d="M100,100 L700,100 L700,300 L100,300 Z" fill="none" stroke="#34D399" stroke-width="2" opacity="0.4" />
  
  <!-- Window -->
  <rect x="550" y="120" width="120" height="80" fill="#111827" stroke="#34D399" stroke-width="1" />
  <line x1="610" y1="120" x2="610" y2="200" stroke="#34D399" stroke-width="1" />
  
  <!-- Desk -->
  <rect x="200" y="200" width="300" height="80" rx="2" fill="#1F2937" stroke="#34D399" stroke-width="2" />
  <rect x="210" y="190" width="280" height="10" rx="2" fill="#374151" stroke="#34D399" stroke-width="1" />
  
  <!-- Computer -->
  <rect x="250" y="140" width="200" height="120" rx="5" fill="#111827" stroke="#34D399" stroke-width="2" />
  <rect x="260" y="150" width="180" height="100" rx="2" fill="#0F172A" stroke="#34D399" stroke-width="1" />
  <rect x="260" y="150" width="180" height="100" fill="url(#screenGlow)" />
  <rect x="340" y="250" width="30" height="10" rx="2" fill="#374151" stroke="#34D399" stroke-width="1" />
  <rect x="320" y="260" width="70" height="5" rx="2" fill="#374151" stroke="#34D399" stroke-width="1" />
  
  <!-- Keyboard -->
  <rect x="290" y="270" width="120" height="20" rx="2" fill="#111827" stroke="#34D399" stroke-width="1" />
  <line x1="300" y1="280" x2="400" y2="280" stroke="#34D399" stroke-width="1" opacity="0.5" />
  
  <!-- Mouse -->
  <ellipse cx="450" cy="280" rx="15" ry="10" fill="#111827" stroke="#34D399" stroke-width="1" />
  
  <!-- Chair -->
  <rect x="320" y="290" width="60" height="10" rx="2" fill="#1F2937" stroke="#34D399" stroke-width="1" />
  <rect x="340" y="300" width="20" height="20" rx="2" fill="#1F2937" stroke="#34D399" stroke-width="1" />
  <rect x="330" y="320" width="40" height="20" rx="5" fill="#1F2937" stroke="#34D399" stroke-width="1" />
  
  <!-- Office Lamp -->
  <path d="M500,200 L500,150 L520,130 L540,150" fill="none" stroke="#34D399" stroke-width="1" />
  <path d="M540,150 L540,160" fill="none" stroke="#34D399" stroke-width="1" />
  <ellipse cx="540" cy="170" rx="15" ry="10" fill="none" stroke="#34D399" stroke-width="1" />
  
  <!-- Bookshelf -->
  <rect x="120" y="130" width="80" height="150" rx="2" fill="#1F2937" stroke="#34D399" stroke-width="2" />
  <rect x="125" y="140" width="70" height="30" rx="1" fill="#111827" stroke="#34D399" stroke-width="1" />
  <rect x="125" y="175" width="70" height="30" rx="1" fill="#111827" stroke="#34D399" stroke-width="1" />
  <rect x="125" y="210" width="70" height="30" rx="1" fill="#111827" stroke="#34D399" stroke-width="1" />
  <rect x="125" y="245" width="70" height="30" rx="1" fill="#111827" stroke="#34D399" stroke-width="1" />
  
  <!-- Smart Office Elements -->
  <rect x="590" y="220" width="40" height="60" rx="5" fill="#111827" stroke="#10B981" stroke-width="1" />
  <circle cx="610" cy="240" r="10" fill="#10B981" opacity="0.5" />
  <circle cx="610" cy="265" r="5" fill="#10B981" opacity="0.5" />
  
  <!-- Smart Lighting -->
  <circle cx="400" cy="100" r="30" fill="none" stroke="#34D399" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="100" r="20" fill="none" stroke="#34D399" stroke-width="1" opacity="0.3" />
  <circle cx="400" cy="100" r="10" fill="#34D399" opacity="0.3" />
  
  <!-- Decorative Lines -->
  <path d="M50,370 L750,370" stroke="#34D399" stroke-width="1" opacity="0.3" />
  <path d="M50,380 L750,380" stroke="#34D399" stroke-width="1" opacity="0.3" />
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">Office</text>
  
  <!-- Futuristic UI Elements -->
  <rect x="50" y="30" width="100" height="25" rx="12" fill="none" stroke="#10B981" stroke-width="1" />
  <rect x="650" y="30" width="100" height="25" rx="12" fill="none" stroke="#10B981" stroke-width="1" />
  <circle cx="65" cy="42" r="8" fill="#10B981" opacity="0.8" />
  <circle cx="735" cy="42" r="8" fill="#10B981" opacity="0.8" />
</svg>