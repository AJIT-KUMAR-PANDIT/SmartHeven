<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0D14" />
      <stop offset="100%" style="stop-color:#1A1F2E" />
    </linearGradient>
    <radialGradient id="screenGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Floor -->
  <path d="M50,300 L750,300 L750,350 L50,350 Z" fill="#111827" opacity="0.7" />
  
  <!-- Walls -->
  <path d="M100,100 L700,100 L700,300 L100,300 Z" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.4" />
  
  <!-- Projection Screen -->
  <rect x="150" y="110" width="300" height="170" fill="#0F1117" stroke="#6366F1" stroke-width="2" />
  <rect x="160" y="120" width="280" height="150" fill="#080A0F" stroke="#6366F1" stroke-width="1" />
  <rect x="160" y="120" width="280" height="150" fill="url(#screenGlow)" />
  
  <!-- Media Console -->
  <rect x="250" y="290" width="100" height="20" rx="2" fill="#111827" stroke="#6366F1" stroke-width="1" />
  <rect x="260" y="280" width="80" height="10" rx="1" fill="#080A0F" stroke="#6366F1" stroke-width="1" />
  
  <!-- Speakers -->
  <rect x="120" y="150" width="20" height="80" rx="2" fill="#111827" stroke="#6366F1" stroke-width="1" />
  <rect x="460" y="150" width="20" height="80" rx="2" fill="#111827" stroke="#6366F1" stroke-width="1" />
  <circle cx="130" cy="170" r="5" fill="#6366F1" opacity="0.5" />
  <circle cx="130" cy="190" r="3" fill="#6366F1" opacity="0.5" />
  <circle cx="130" cy="210" r="5" fill="#6366F1" opacity="0.5" />
  <circle cx="470" cy="170" r="5" fill="#6366F1" opacity="0.5" />
  <circle cx="470" cy="190" r="3" fill="#6366F1" opacity="0.5" />
  <circle cx="470" cy="210" r="5" fill="#6366F1" opacity="0.5" />
  
  <!-- Couch -->
  <path d="M500,200 L500,260 Q500,270 510,270 L670,270 Q680,270 680,260 L680,200" 
        fill="#141A2A" stroke="#6366F1" stroke-width="2" />
  <path d="M510,210 L510,270 Q510,280 520,280 L660,280 Q670,280 670,270 L670,210" 
        fill="#0F1524" stroke="#6366F1" stroke-width="2" />
  
  <!-- Media Controls -->
  <rect x="550" y="160" width="80" height="30" rx="5" fill="#0F1117" stroke="#818CF8" stroke-width="1" />
  <circle cx="570" cy="175" r="8" fill="#4F46E5" opacity="0.8" />
  <circle cx="590" cy="175" r="8" fill="#4F46E5" opacity="0.8" />
  <circle cx="610" cy="175" r="8" fill="#4F46E5" opacity="0.8" />
  
  <!-- Smart Lighting -->
  <circle cx="400" cy="100" r="30" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="100" r="20" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3" />
  <circle cx="400" cy="100" r="10" fill="#6366F1" opacity="0.3" />
  
  <!-- Ambient Lights -->
  <rect x="100" y="100" width="5" height="200" fill="#4F46E5" opacity="0.2" />
  <rect x="695" y="100" width="5" height="200" fill="#4F46E5" opacity="0.2" />
  
  <!-- Decorative Lines -->
  <path d="M50,370 L750,370" stroke="#6366F1" stroke-width="1" opacity="0.3" />
  <path d="M50,380 L750,380" stroke="#6366F1" stroke-width="1" opacity="0.3" />
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">Media Room</text>
  
  <!-- Futuristic UI Elements -->
  <rect x="50" y="30" width="100" height="25" rx="12" fill="none" stroke="#818CF8" stroke-width="1" />
  <rect x="650" y="30" width="100" height="25" rx="12" fill="none" stroke="#818CF8" stroke-width="1" />
  <circle cx="65" cy="42" r="8" fill="#818CF8" opacity="0.8" />
  <circle cx="735" cy="42" r="8" fill="#818CF8" opacity="0.8" />
</svg>