<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1F2D" />
      <stop offset="100%" style="stop-color:#19344D" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Floor -->
  <path d="M50,300 L750,300 L750,350 L50,350 Z" fill="#1C3144" opacity="0.7" />
  
  <!-- Walls -->
  <path d="M100,100 L700,100 L700,300 L100,300 Z" fill="none" stroke="#06B6D4" stroke-width="2" opacity="0.4" />
  
  <!-- Bathtub -->
  <rect x="480" y="120" width="180" height="90" rx="10" fill="#0F2F44" stroke="#06B6D4" stroke-width="2" />
  <rect x="490" y="130" width="160" height="70" rx="5" fill="#0D1F2D" stroke="#06B6D4" stroke-width="1" />
  
  <!-- Shower -->
  <rect x="480" y="220" width="90" height="70" rx="5" fill="#0F2F44" stroke="#06B6D4" stroke-width="2" />
  <line x1="525" y1="220" x2="525" y2="290" stroke="#06B6D4" stroke-width="1" />
  <circle cx="515" cy="240" r="5" fill="#06B6D4" opacity="0.8" />
  <circle cx="535" cy="240" r="5" fill="#06B6D4" opacity="0.8" />
  
  <!-- Sink -->
  <rect x="140" y="120" width="120" height="70" rx="5" fill="#0F2F44" stroke="#06B6D4" stroke-width="2" />
  <ellipse cx="200" cy="140" rx="30" ry="20" fill="#0D1F2D" stroke="#06B6D4" stroke-width="1" />
  <circle cx="200" cy="140" r="5" fill="#06B6D4" opacity="0.5" />
  <path d="M200,150 L200,160" stroke="#06B6D4" stroke-width="1" />
  
  <!-- Mirror -->
  <rect x="155" y="210" width="90" height="70" rx="2" fill="#0D1F2D" stroke="#22D3EE" stroke-width="1" />
  <rect x="160" y="215" width="80" height="60" rx="1" fill="#0F2F44" stroke="#22D3EE" stroke-width="1" opacity="0.7" />
  
  <!-- Toilet -->
  <rect x="300" y="120" width="60" height="80" rx="5" fill="#0F2F44" stroke="#06B6D4" stroke-width="2" />
  <ellipse cx="330" cy="130" rx="20" ry="10" fill="#0D1F2D" stroke="#06B6D4" stroke-width="1" />
  <rect x="310" y="140" width="40" height="50" rx="5" fill="#0D1F2D" stroke="#06B6D4" stroke-width="1" />
  
  <!-- Towel Rail -->
  <line x1="400" y1="140" x2="450" y2="140" stroke="#06B6D4" stroke-width="2" />
  <path d="M410,140 L410,170 Q410,180 420,180 L440,180 Q450,180 450,170 L450,140" 
        fill="none" stroke="#06B6D4" stroke-width="1" />
  
  <!-- Smart Bathroom Elements -->
  <rect x="320" y="230" width="30" height="50" rx="5" fill="#0D1F2D" stroke="#22D3EE" stroke-width="1" />
  <circle cx="335" cy="245" r="8" fill="#22D3EE" opacity="0.8" />
  <circle cx="335" cy="265" r="8" fill="#22D3EE" opacity="0.8" />
  
  <!-- Smart Lighting -->
  <circle cx="400" cy="100" r="30" fill="none" stroke="#FFEB3B" stroke-width="1" opacity="0.2" />
  <circle cx="400" cy="100" r="20" fill="none" stroke="#FFEB3B" stroke-width="1" opacity="0.3" />
  <circle cx="400" cy="100" r="10" fill="#FFEB3B" opacity="0.3" />
  
  <!-- Decorative Lines -->
  <path d="M50,370 L750,370" stroke="#06B6D4" stroke-width="1" opacity="0.3" />
  <path d="M50,380 L750,380" stroke="#06B6D4" stroke-width="1" opacity="0.3" />
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">Bathroom</text>
  
  <!-- Futuristic UI Elements -->
  <rect x="50" y="30" width="100" height="25" rx="12" fill="none" stroke="#22D3EE" stroke-width="1" />
  <rect x="650" y="30" width="100" height="25" rx="12" fill="none" stroke="#22D3EE" stroke-width="1" />
  <circle cx="65" cy="42" r="8" fill="#22D3EE" opacity="0.8" />
  <circle cx="735" cy="42" r="8" fill="#22D3EE" opacity="0.8" />
</svg>