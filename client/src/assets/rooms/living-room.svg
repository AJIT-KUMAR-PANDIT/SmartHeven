<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#051937" />
      <stop offset="100%" style="stop-color:#0F3363" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="400" fill="url(#bgGradient)" />
  
  <!-- Floor -->
  <path d="M50,300 L750,300 L750,350 L50,350 Z" fill="#2C3E50" opacity="0.7" />
  
  <!-- Walls -->
  <path d="M100,100 L700,100 L700,300 L100,300 Z" fill="none" stroke="#4B89DC" stroke-width="2" opacity="0.5" />
  
  <!-- Windows -->
  <rect x="150" y="100" width="120" height="80" fill="#1F4287" stroke="#4FC3F7" stroke-width="1" />
  <rect x="530" y="100" width="120" height="80" fill="#1F4287" stroke="#4FC3F7" stroke-width="1" />
  
  <!-- Smart TV -->
  <rect x="320" y="120" width="160" height="90" fill="#111" stroke="#4FC3F7" stroke-width="2" rx="5" />
  <rect x="330" y="130" width="140" height="70" fill="#0A2540" stroke="none" />
  
  <!-- TV Stand -->
  <rect x="340" y="210" width="120" height="30" fill="#37474F" stroke="#4B89DC" stroke-width="1" />
  <rect x="360" y="240" width="80" height="10" fill="#263238" stroke="#4B89DC" stroke-width="1" />
  
  <!-- Sofa -->
  <path d="M200,220 L200,280 Q200,290 210,290 L590,290 Q600,290 600,280 L600,220" 
        fill="#182848" stroke="#4B89DC" stroke-width="2" />
  <path d="M180,240 L180,290 Q180,300 190,300 L610,300 Q620,300 620,290 L620,240" 
        fill="#0A2540" stroke="#4B89DC" stroke-width="2" />
  
  <!-- Coffee Table -->
  <ellipse cx="400" cy="230" rx="80" ry="30" fill="none" stroke="#64B5F6" stroke-width="1" opacity="0.7" />
  
  <!-- Smart Home Controls -->
  <rect x="700" y="150" width="30" height="50" rx="5" fill="#182848" stroke="#4FC3F7" stroke-width="1" />
  <circle cx="715" cy="165" r="5" fill="#29B6F6" />
  <circle cx="715" cy="185" r="5" fill="#4FC3F7" />
  
  <!-- Smart Lighting -->
  <circle cx="400" cy="100" r="30" fill="none" stroke="#FFEB3B" stroke-width="1" opacity="0.3" />
  <circle cx="400" cy="100" r="20" fill="none" stroke="#FFEB3B" stroke-width="1" opacity="0.5" />
  <circle cx="400" cy="100" r="10" fill="#FFEB3B" opacity="0.5" />
  
  <!-- Decorative Lines -->
  <path d="M50,370 L750,370" stroke="#64B5F6" stroke-width="1" opacity="0.3" />
  <path d="M50,380 L750,380" stroke="#64B5F6" stroke-width="1" opacity="0.3" />
  
  <!-- Title -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#FFFFFF">Living Room</text>
  
  <!-- Futuristic UI Elements -->
  <rect x="50" y="30" width="100" height="25" rx="12" fill="none" stroke="#29B6F6" stroke-width="1" />
  <rect x="650" y="30" width="100" height="25" rx="12" fill="none" stroke="#29B6F6" stroke-width="1" />
  <circle cx="65" cy="42" r="8" fill="#29B6F6" opacity="0.8" />
  <circle cx="735" cy="42" r="8" fill="#29B6F6" opacity="0.8" />
</svg>