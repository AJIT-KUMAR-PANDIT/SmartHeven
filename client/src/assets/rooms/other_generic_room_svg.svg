<svg viewBox="0 0 140 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Room background -->
  <rect x="5" y="5" width="130" height="70" fill="#f5f5f5" stroke="#000000" stroke-width="2"/>
  
  <!-- Text label -->
  <text x="70" y="20" font-family="Arial, sans-serif" font-size="7" text-anchor="middle" font-weight="bold">ROOM</text>
  
  <!-- Subtle grid pattern to indicate multipurpose nature -->
  <pattern id="grid" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(45)">
    <path d="M 0 0 L 0 10 M 10 0 L 10 10" stroke="#cccccc" stroke-width="0.5" fill="none"/>
  </pattern>
  <rect x="5" y="5" width="130" height="70" fill="url(#grid)" opacity="0.3"/>
  
  <!-- Generic furniture indicators -->
  <rect x="20" y="40" width="35" height="20" fill="#bbbbbb" stroke="#555555" stroke-width="1"/>
  <rect x="85" y="40" width="35" height="20" fill="#bbbbbb" stroke="#555555" stroke-width="1"/>
  <rect x="20" y="65" width="100" height="5" fill="#bbbbbb" stroke="#555555" stroke-width="1"/>
  <circle cx="70" cy="30" r="8" fill="#dddddd" stroke="#555555" stroke-width="1"/>
  
  <!-- Drag handle -->
  <circle cx="70" cy="40" r="5" fill="#007bff" opacity="0.7"/>
  <circle cx="70" cy="40" r="3" fill="#ffffff"/>
</svg>